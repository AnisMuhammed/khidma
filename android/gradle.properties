org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# تشغيل مترجم Kotlin داخل عملية Gradle نفسها بدل عملية منفصلة.
# السبب: كان البناء يفشل بـ "Could not connect to Kotlin compile daemon" —
# إما لأن الذاكرة المطلوبة (8G + 4G) أكبر من ذاكرة الجهاز، أو لأن مضاد
# الفيروسات يحجب اتصال العملية المنفصلة على localhost. الحلان واحد.
kotlin.compiler.execution.strategy=in-process
