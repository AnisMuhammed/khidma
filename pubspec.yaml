name: khidma
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  shared_preferences: ^2.5.4
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.1
  cloud_firestore: ^6.10.0
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  path_provider: ^2.1.5
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# ---------------------------------------------------------------------------
# أيقونة التطبيق — تُولَّد من شعار خِدْمَة نفسه المستخدم في شاشة البداية،
# فتكون الأيقونة والبداية والشعار بالهوية ذاتها.
#
#   ١) flutter pub get
#   ٢) dart run flutter_launcher_icons
#   ٣) flutter build apk --release   (أو flutter run لإعادة التثبيت على الهاتف)
#
# الشعار مربّع (نسبة 1:1) وخلفيته بلون العلامة نفسه، والبيت الأبيض يشغل نحو
# نصف عرضه — أي داخل المنطقة الآمنة (66%) التي تقصّ عندها أيقونة أندرويد
# التكيّفية، فلا يُقتطع من الشعار شيء.
#
# adaptive_icon_background يأخذ لون العلامة المعتمد في المشروع نفسه (#0F766E)
# والمستخدم في flutter_native_splash أعلاه، فلو ظهرت حواف الشعار بعد القصّ
# التكيّفي جاءت بلون الخلفية ذاته بلا أي حدّ ظاهر.
#
# قسم web يولّد أيضاً أيقونة تبويب المتصفح و favicon، لأن التطبيق يعمل على
# الويب كذلك. احذف القسم كله إن أردت الاكتفاء بأندرويد و iOS.
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/logo/khidma_logo.png"

  # تنبيه: في هذا الإصدار (0.14.4) قيمة web ليست true/false بل خريطة إعدادات.
  # كتابتها `web: true` ترمي InvalidConfigException وتوقف التوليد كله قبل أن
  # يُكتب أي ملف — لأن الحزمة تتحقق من الإعداد بالكامل أولاً. وgenerate: true
  # هي المفتاح الذي يُشغّل توليد الويب فعلاً.
  web:
    generate: true
    image_path: "assets/images/logo/khidma_logo.png"
    background_color: "#0F766E"
    theme_color: "#0F766E"

  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/images/logo/khidma_logo.png"

  # إزالة قناة الشفافية من أيقونة iOS — متطلّب رفع التطبيق على App Store.
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/logo/
    - assets/images/services/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
